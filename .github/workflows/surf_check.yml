name: Hourly SwellMind Surf Check

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 3,18 * * *'
  # Allows you to also trigger it manually from the GitHub website!
  workflow_dispatch:

jobs:
  check-surf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyttsx3

      - name: Run SwellMind Surf Check
        run: python lessons/day01_intro.py --cron